    <script>
      // Applies the stored theme before the first paint. Vite serves a plain
      // SPA, so nothing injects this for us and a reload would otherwise flash
      // the light palette before React mounts. The storage key must stay in
      // step with the one next-themes reads.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          // Storage can be unavailable (private mode, blocked cookies). The
          // light default is fine and next-themes recovers after mount.
        }
      })();
    </script>
